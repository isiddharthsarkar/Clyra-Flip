name: Build Clyra-Flip Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build (ruan, dizi, or all)'
        required: false
        default: 'all'
      android:
        description: 'Android version (android14, android15, android16, android17, or all)'
        required: false
        default: 'all'
      upload_release:
        description: 'Upload zip to GitHub Release v1.0.0'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  push:
    branches:
      - main
    paths:
      - 'build.sh'
      - 'flashable/**'
      - '.github/workflows/build-kernel.yml'
      - 'arch/arm64/configs/vendor/**'
      - 'build.config.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            xz-utils \
            tar \
            gzip \
            unzip \
            zip \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            rsync \
            file \
            make \
            gcc \
            clang \
            llvm \
            lld

      - name: Verify cross compilers
        run: |
          which aarch64-linux-gnu-gcc || echo "WARNING: aarch64-linux-gnu-gcc not found"
          which arm-linux-gnueabi-gcc || echo "WARNING: arm-linux-gnueabi-gcc not found"
          aarch64-linux-gnu-gcc --version | head -1 || true
          arm-linux-gnueabi-gcc --version | head -1 || true

      - name: Download AOSP clang-r416183b
        run: |
          set -euo pipefail
          mkdir -p ~/clyra-tools
          cd ~/clyra-tools
          echo "Attempting to download clang-r416183b..."
          if curl -L -f -s -o clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/clang-r416183b.tar.gz"; then
            echo "Download succeeded via curl"
            tar -xzf clang-r416183b.tar.gz
          elif wget -q -O clang-r416183b.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/clang-r416183b.tar.gz"; then
            echo "Download succeeded via wget"
            tar -xzf clang-r416183b.tar.gz
          else
            echo "WARNING: Could not download clang-r416183b from Android CI"
            echo "Trying alternative: Android NDK..."
            curl -L -f -s -o android-ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip"
            unzip -q android-ndk.zip
            # Search for clang binary anywhere in NDK (look for *clang* executables, not just "clang")
            CLANG_BIN=$(find ~/clyra-tools/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin -name "*clang*" -type f -executable 2>/dev/null | grep -v "clang++" | head -1)
            if [ -z "$CLANG_BIN" ]; then
                # Fallback: any clang* executable in NDK
                CLANG_BIN=$(find ~/clyra-tools/android-ndk-r26b -name "*clang*" -type f -executable 2>/dev/null | grep -v "clang++" | head -1)
            fi
            if [ -n "$CLANG_BIN" ]; then
                CLANG_DIR=$(dirname "$CLANG_BIN")
                echo "Found clang at: $CLANG_BIN"
                echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
                echo "CLANG_DIR_FALLBACK=$CLANG_DIR" >> $GITHUB_ENV
            else
                echo "ERROR: No clang found in NDK!"
                find ~/clyra-tools/android-ndk-r26b -name "*clang*" 2>/dev/null | head -20 || true
                exit 1
            fi
          fi
          if [ -x ~/clyra-tools/clang-r416183b/bin/clang ]; then
            echo "CLANG_DIR=~/clyra-tools/clang-r416183b" >> $GITHUB_ENV
            ~/clyra-tools/clang-r416183b/bin/clang --version
          elif [ -n "${CLANG_DIR_FALLBACK:-}" ] && [ -x "${CLANG_DIR_FALLBACK}/bin/clang" ]; then
            echo "Using NDK clang fallback"
            ${CLANG_DIR_FALLBACK}/bin/clang --version
          else
            echo "ERROR: No clang found!"
            ls -la ~/clyra-tools/ || true
            exit 1
          fi

      - name: Determine build matrix
        id: matrix
        run: |
          set -euo pipefail
          DEVICE="${{ github.event.inputs.device }}"
          ANDROID="${{ github.event.inputs.android }}"
          if [ "$DEVICE" = "all" ]; then
            DEVICES="ruan dizi"
          else
            DEVICES="$DEVICE"
          fi
          if [ "$ANDROID" = "all" ]; then
            ANDROIDS="android14 android15 android16 android17"
          else
            ANDROIDS="$ANDROID"
          fi
          echo "devices=$DEVICES" >> $GITHUB_OUTPUT
          echo "androids=$ANDROIDS" >> $GITHUB_OUTPUT

      - name: Build all kernel combinations
        run: |
          set -euo pipefail
          CLANG_DIR="${CLANG_DIR:-~/clyra-tools/clang-r416183b}"
          echo "Using CLANG_DIR: $CLANG_DIR"
          ls -la "$CLANG_DIR/bin/clang" || echo "WARNING: clang not found at expected path"
          for dev in ${{ steps.matrix.outputs.devices }}; do
            for ver in ${{ steps.matrix.outputs.androids }}; do
              echo "========================================"
              echo "Building $dev $ver"
              echo "========================================"
              ./build.sh "$CLANG_DIR" "$dev" "$ver"
              if [ ! -f "out-${dev}66.${ver}/arch/arm64/boot/Image" ]; then
                echo "ERROR: Build failed for $dev $ver - Image not found"
                ls -la "out-${dev}66.${ver}/arch/arm64/boot/" 2>/dev/null || echo "No boot dir"
                exit 1
              fi
              echo "SUCCESS: $dev $ver built"
            done
          done

      - name: Package universal flashable zip
        run: |
          set -euo pipefail
          ./flashable/package.sh .

      - name: Verify zip contents
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No universal zip found"
            ls -la *.zip 2>/dev/null || echo "No zip files at all"
            exit 1
          fi
          echo "Zip created: $ZIP"
          unzip -l "$ZIP"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clyra-flip-kernel-universal-zip
          path: clyra-flip-kernel-universal-*.zip
          retention-days: 7

      - name: Write release notes file
        if: (github.event.inputs.upload_release == 'true' || github.event_name == 'push') && success()
        run: |
          printf 'Clyra-Flip Kernel v1.0.0\n\n' > /tmp/release-notes.md
          printf 'Clyra-Flip Kernel 6.6.144-Clyra-Flip for ruan (Redmi Pad Pro 5G) and dizi (Redmi Pad Pro WiFi).\n\n' >> /tmp/release-notes.md
          printf 'Built with GitHub Actions\n' >> /tmp/release-notes.md
          printf 'Kernel: Linux 6.6.144-Clyra-Flip\n' >> /tmp/release-notes.md
          printf 'Devices: ruan, dizi\n' >> /tmp/release-notes.md
          printf 'Android: 14, 15, 16, 17\n' >> /tmp/release-notes.md
          printf 'Compiler: AOSP clang-r416183b (or NDK fallback)\n' >> /tmp/release-notes.md
          printf 'Features: KernelSU, susfs, CAF/Qualcomm platform support\n\n' >> /tmp/release-notes.md
          printf 'Flash via TWRP/OrangeFox recovery. Auto-detects device and Android version.\n' >> /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Upload to GitHub Release v1.0.0
        if: (github.event.inputs.upload_release == 'true' || github.event_name == 'push') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No universal zip found for release upload"
            exit 1
          fi
          echo "Uploading $ZIP to release v1.0.0..."
          which gh || { echo "ERROR: gh CLI not found"; exit 1; }
          if gh release view v1.0.0 --json tagName -q '.tagName' 2>/dev/null | grep -q "v1.0.0"; then
            echo "Release v1.0.0 exists, uploading asset..."
            gh release upload v1.0.0 "$ZIP" --clobber
          else
            echo "Release v1.0.0 does not exist, creating it..."
            gh release create v1.0.0 \
              --title "Clyra-Flip Kernel v1.0.0" \
              --notes-file /tmp/release-notes.md
            gh release upload v1.0.0 "$ZIP" --clobber
          fi
          echo "Upload complete!"

      - name: Print release URL
        if: always()
        run: |
          echo "========================================"
          echo "Build complete!"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/v1.0.0"
          echo "Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================"