name: Build Clyra-Flip Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build (ruan, dizi, or all)'
        required: false
        default: 'all'
      android:
        description: 'Android version (android14, android15, android16, android17, or all)'
        required: false
        default: 'all'
      upload_release:
        description: 'Upload zip to GitHub Release v1.0.0'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  push:
    branches:
      - main
    paths:
      - 'build.sh'
      - 'flashable/**'
      - '.github/workflows/build-kernel.yml'
      - 'arch/arm64/configs/vendor/**'
      - 'build.config.*'
      - 'drivers/misc/ksu/**'
      - 'drivers/caf/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            dwarves \
            xz-utils \
            tar \
            gzip \
            unzip \
            zip \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            rsync \
            file \
            make \
            gcc \
            clang \
            llvm \
            lld

      - name: Verify cross compilers
        run: |
          which aarch64-linux-gnu-gcc || echo "WARNING: aarch64-linux-gnu-gcc not found"
          which arm-linux-gnueabi-gcc || echo "WARNING: arm-linux-gnueabi-gcc not found"
          aarch64-linux-gnu-gcc --version | head -1 || true
          arm-linux-gnueabi-gcc --version | head -1 || true

      - name: Setup AOSP clang
        run: |
          set -euo pipefail
          # Install AOSP-compatible clang (clang-14, close to clang-r416183b used by GKI builds)
          # Ubuntu system clang 21.x is too new and produces different symbol CRCs,
          # breaking KMI compatibility with stock vendor modules.
          sudo apt-get update -qq
          sudo apt-get install -y clang-14 llvm-14 lld-14 || {
            echo "clang-14 not in default repos, adding LLVM apt repository..."
            sudo apt-get install -y wget gnupg software-properties-common
            wget -q -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-14 main" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update -qq
            sudo apt-get install -y clang-14 llvm-14 lld-14
          }
          # Create directory structure expected by build.sh: CLANG_DIR/bin/clang
          mkdir -p "$HOME/clyra-tools/aosp-clang/bin"
          ln -sf /usr/bin/clang-14 "$HOME/clyra-tools/aosp-clang/bin/clang"
          ln -sf /usr/bin/clang++-14 "$HOME/clyra-tools/aosp-clang/bin/clang++"
          ln -sf /usr/bin/llvm-ar-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-ar" 2>/dev/null || true
          ln -sf /usr/bin/llvm-nm-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-nm" 2>/dev/null || true
          ln -sf /usr/bin/llvm-objcopy-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-objcopy" 2>/dev/null || true
          ln -sf /usr/bin/llvm-strip-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-strip" 2>/dev/null || true
          ln -sf /usr/bin/llvm-readelf-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-readelf" 2>/dev/null || true
          ln -sf /usr/bin/llvm-objdump-14 "$HOME/clyra-tools/aosp-clang/bin/llvm-objdump" 2>/dev/null || true
          echo "CLANG_DIR=$HOME/clyra-tools/aosp-clang" >> $GITHUB_ENV
          echo "Using AOSP-compatible clang:"
          "$HOME/clyra-tools/aosp-clang/bin/clang" --version

      - name: Determine build matrix
        id: matrix
        run: |
          set -euo pipefail
          DEVICE="${{ github.event.inputs.device }}"
          ANDROID="${{ github.event.inputs.android }}"
          # Default to "all" when running on push (no inputs)
          [ -z "$DEVICE" ] && DEVICE="all"
          [ -z "$ANDROID" ] && ANDROID="all"
          if [ "$DEVICE" = "all" ]; then
            DEVICES="ruan dizi"
          else
            DEVICES="$DEVICE"
          fi
          if [ "$ANDROID" = "all" ]; then
            ANDROIDS="android14 android15 android16 android17"
          else
            ANDROIDS="$ANDROID"
          fi
          echo "devices=$DEVICES" >> $GITHUB_OUTPUT
          echo "androids=$ANDROIDS" >> $GITHUB_OUTPUT

      - name: Build all kernel combinations
        run: |
          set -uo pipefail
          CLANG_DIR="${CLANG_DIR:-$HOME/clyra-tools/system-clang}"
          echo "Using CLANG_DIR: $CLANG_DIR"
          ls -la "$CLANG_DIR/bin/clang" || echo "WARNING: clang not found at expected path"
          DIAG="/tmp/build-diagnostics.txt"
          {
            echo "Build Diagnostics"
            echo "================="
            echo "CLANG_DIR: $CLANG_DIR"
            echo "clang version: $("$CLANG_DIR/bin/clang" --version 2>/dev/null | head -1)"
            echo ""
          } > "$DIAG"
          FAILED=0
          for dev in ${{ steps.matrix.outputs.devices }}; do
            for ver in ${{ steps.matrix.outputs.androids }}; do
              echo "=========================================="
              echo "Building $dev $ver"
              echo "=========================================="
              {
                echo "--- $dev $ver ---"
              } >> "$DIAG"
              if ./build.sh "$CLANG_DIR" "$dev" "$ver" >> "$DIAG" 2>&1; then
                if [ -f "out-${dev}66.${ver}/arch/arm64/boot/Image" ]; then
                  echo "SUCCESS: $dev $ver built"
                  echo "RESULT: PASS - Image found" >> "$DIAG"
                else
                  echo "ERROR: Build succeeded but Image not found for $dev $ver"
                  ls -la "out-${dev}66.${ver}/arch/arm64/boot/" 2>/dev/null || echo "No boot dir"
                  ls -la "out-${dev}66.${ver}/arch/arm64/boot/" 2>/dev/null >> "$DIAG" || echo "No boot dir" >> "$DIAG"
                  echo "RESULT: FAIL - Image not found despite build success" >> "$DIAG"
                  FAILED=1
                fi
              else
                EXIT_CODE=$?
                echo "ERROR: Build failed for $dev $ver with exit code $EXIT_CODE"
                echo "RESULT: FAIL - build.sh exited with code $EXIT_CODE" >> "$DIAG"
                FAILED=1
              fi
              echo "" >> "$DIAG"
            done
          done
          echo "" >> "$DIAG"
          if [ $FAILED -eq 0 ]; then
            echo "All builds passed"
            echo "OVERALL: ALL PASS" >> "$DIAG"
          else
            echo "Some builds failed"
            echo "OVERALL: SOME FAIL" >> "$DIAG"
            exit 1
          fi

      - name: Save build diagnostics
        if: always()
        run: |
          set -e
          DIAG="/tmp/build-diagnostics.txt"
          if [ -f "$DIAG" ]; then
            cp "$DIAG" build-diagnostics.txt
            git config user.email "clyra-flip@github-actions"
            git config user.name "Clyra-Flip CI"
            git add build-diagnostics.txt
            git commit -m "CI: build diagnostics from run ${{ github.run_id }}" || true
            git push origin main || true
          fi

      - name: Package universal flashable zip
        run: |
          set -euo pipefail
          chmod +x flashable/package.sh
          ./flashable/package.sh .

      - name: Verify zip contents
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No universal zip found"
            ls -la *.zip 2>/dev/null || echo "No zip files at all"
            exit 1
          fi
          echo "Zip created: $ZIP"
          unzip -l "$ZIP"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clyra-flip-kernel-universal-zip
          path: clyra-flip-kernel-universal-*.zip
          retention-days: 7

      - name: Write release notes file
        if: (github.event.inputs.upload_release == 'true' || github.event_name == 'push') && success()
        run: |
          printf 'Clyra-Flip Kernel v1.0.0\n\n' > /tmp/release-notes.md
          printf 'Clyra-Flip Kernel 6.6.144-Clyra-Flip for ruan (Redmi Pad Pro 5G) and dizi (Redmi Pad Pro WiFi).\n\n' >> /tmp/release-notes.md
          printf 'Built with GitHub Actions\n' >> /tmp/release-notes.md
          printf 'Kernel: Linux 6.6.144-Clyra-Flip\n' >> /tmp/release-notes.md
          printf 'Devices: ruan, dizi\n' >> /tmp/release-notes.md
          printf 'Android: 14, 15, 16, 17\n' >> /tmp/release-notes.md
          printf 'Compiler: AOSP clang-r416183b (or NDK fallback)\n' >> /tmp/release-notes.md
          printf 'Features: KernelSU, susfs, CAF/Qualcomm platform support\n\n' >> /tmp/release-notes.md
          printf 'Flash via TWRP/OrangeFox recovery. Auto-detects device and Android version.\n' >> /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Upload to GitHub Release v1.0.0
        if: (github.event.inputs.upload_release == 'true' || github.event_name == 'push') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No universal zip found for release upload"
            exit 1
          fi
          echo "Uploading $ZIP to release v1.0.0..."
          which gh || { echo "ERROR: gh CLI not found"; exit 1; }
          if gh release view v1.0.0 --json tagName -q '.tagName' 2>/dev/null | grep -q "v1.0.0"; then
            echo "Release v1.0.0 exists, uploading asset..."
            gh release upload v1.0.0 "$ZIP" --clobber
          else
            echo "Release v1.0.0 does not exist, creating it..."
            gh release create v1.0.0 \
              --title "Clyra-Flip Kernel v1.0.0" \
              --notes-file /tmp/release-notes.md
            gh release upload v1.0.0 "$ZIP" --clobber
          fi
          echo "Upload complete!"

      - name: Print release URL
        if: always()
        run: |
          echo "========================================"
          echo "Build complete!"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/v1.0.0"
          echo "Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================"