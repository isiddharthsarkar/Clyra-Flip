name: Build Clyra-Flip Kernel (Enterprise Matrix Pipeline)

# CI WORKFLOWS DISABLED - No workflows should start automatically.
# All commits must include [skip ci]. Manual workflow_dispatch only.
# To re-enable, restore the push/workflow_dispatch triggers above.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device team to run (ruan, dizi, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'ruan'
          - 'dizi'
      android:
        description: 'Android version target (android14, android15, android16, android17, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android14'
          - 'android15'
          - 'android16'
          - 'android17'
      upload_release:
        description: 'Publish zip to GitHub Release v1.0.0'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  # push trigger removed to prevent automatic CI runs

permissions:
  contents: write

concurrency:
  group: build-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Team RUAN Division: Redmi Pad Pro 5G (SM7435 / parrot)
  # 4 Workers running in parallel across Android 14, 15, 16, 17
  # =========================================================================
  build-ruan:
    name: "RUAN Team: ${{ matrix.android }}"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.device == 'all' || github.event.inputs.device == 'ruan'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        android: [android14, android15, android16, android17]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version filter
        id: filter
        run: |
          REQ="${{ github.event.inputs.android || 'all' }}"
          if [ "$REQ" != "all" ] && [ "$REQ" != "${{ matrix.android }}" ]; then
            echo "Skipping ${{ matrix.android }} as $REQ was explicitly requested."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install build dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            dwarves \
            xz-utils \
            tar \
            gzip \
            unzip \
            zip \
            python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            rsync \
            file \
            make \
            gcc \
            clang \
            llvm \
            lld

      - name: Cache AOSP Clang toolchain
        if: steps.filter.outputs.skip != 'true'
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/clyra-tools/aosp-clang
          key: aosp-clang-r416183b-v1

      - name: Setup AOSP Clang
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/clyra-tools"
          AOSP_CLANG_DIR="$HOME/clyra-tools/aosp-clang"

          if [ -x "$AOSP_CLANG_DIR/bin/clang" ]; then
            echo "AOSP Clang restored from cache."
          else
            echo "Acquiring official AOSP clang-r416183b toolchain..."
            if git clone --depth=1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git "$AOSP_CLANG_DIR" 2>/dev/null && [ -x "$AOSP_CLANG_DIR/bin/clang" ]; then
              echo "AOSP clang-r416183b successfully acquired."
            else
              echo "AOSP git clone unavailable; falling back to package repos..."
              rm -rf "$AOSP_CLANG_DIR"
              CLANG_VERSION=""
              for VER in 17 16 15 14; do
                echo "Trying clang-${VER} from Ubuntu repos..."
                sudo apt-get update -qq
                if sudo apt-get install -y clang-${VER} llvm-${VER} lld-${VER} 2>&1 | grep -qiE "unable to locate package|not a valid"; then
                  continue
                fi
                if command -v clang-${VER} >/dev/null 2>&1; then
                  CLANG_VERSION=${VER}
                  break
                fi
              done
              if [ -n "$CLANG_VERSION" ]; then
                mkdir -p "$AOSP_CLANG_DIR/bin"
                ln -sf "$(which clang-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/clang"
                ln -sf "$(which clang++-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/clang++"
                ln -sf "$(which ld.lld-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/ld.lld"
                ln -sf "$(which llvm-ar-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-ar"
                ln -sf "$(which llvm-nm-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-nm"
                ln -sf "$(which llvm-objcopy-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-objcopy"
                ln -sf "$(which llvm-objdump-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-objdump"
                ln -sf "$(which llvm-readelf-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-readelf"
                ln -sf "$(which llvm-strip-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-strip"
              fi
            fi
          fi

          if [ -x "$AOSP_CLANG_DIR/bin/clang" ]; then
            echo "CLANG_DIR=$AOSP_CLANG_DIR" >> $GITHUB_ENV
            "$AOSP_CLANG_DIR/bin/clang" --version
          else
            echo "ERROR: Failed to initialize Clang toolchain."
            exit 1
          fi

      - name: Build ruan (${{ matrix.android }})
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh "$CLANG_DIR" ruan "${{ matrix.android }}" Image modules dtbs

      - name: Verify build outputs
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OUT="out-ruan66.${{ matrix.android }}"
          if [ ! -f "$OUT/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found at $OUT/arch/arm64/boot/Image"
            exit 1
          fi
          echo "Kernel Image verified:"
          ls -lh "$OUT/arch/arm64/boot/Image"

      - name: Upload ruan ${{ matrix.android }} build artifact
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-ruan-${{ matrix.android }}
          path: |
            out-ruan66.${{ matrix.android }}/arch/arm64/boot/Image
            out-ruan66.${{ matrix.android }}/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out-ruan66.${{ matrix.android }}/include/config/kernel.release
          retention-days: 3

      - name: Summary for ruan ${{ matrix.android }}
        if: always() && steps.filter.outputs.skip != 'true'
        run: |
          OUT="out-ruan66.${{ matrix.android }}"
          echo "### RUAN Division: ${{ matrix.android }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "$OUT/arch/arm64/boot/Image" ]; then
            SIZE=$(ls -lh "$OUT/arch/arm64/boot/Image" | awk '{print $5}')
            echo "- **Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "- **Kernel Image**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Target**: Redmi Pad Pro 5G (ruan)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # Team DIZI Division: Redmi Pad Pro WiFi / POCO Pad (SM7435 / parrot)
  # 4 Workers running in parallel across Android 14, 15, 16, 17
  # =========================================================================
  build-dizi:
    name: "DIZI Team: ${{ matrix.android }}"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.device == 'all' || github.event.inputs.device == 'dizi'
