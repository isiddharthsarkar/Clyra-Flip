          path: |
            out-dizi66.${{ matrix.android }}/arch/arm64/boot/Image
            out-dizi66.${{ matrix.android }}/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out-dizi66.${{ matrix.android }}/include/config/kernel.release
