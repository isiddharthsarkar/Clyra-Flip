                  break
                fi
              done
              if [ -n "$CLANG_VERSION" ]; then
                mkdir -p "$AOSP_CLANG_DIR/bin"
                ln -sf "$(which clang-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/clang"
                ln -sf "$(which clang++-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/clang++"
                ln -sf "$(which ld.lld-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/ld.lld"
                ln -sf "$(which llvm-ar-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-ar"
                ln -sf "$(which llvm-nm-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-nm"
                ln -sf "$(which llvm-objcopy-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-objcopy"
                ln -sf "$(which llvm-objdump-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-objdump"
                ln -sf "$(which llvm-readelf-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-readelf"
                ln -sf "$(which llvm-strip-${CLANG_VERSION})" "$AOSP_CLANG_DIR/bin/llvm-strip"
              fi
            fi
          fi

          if [ -x "$AOSP_CLANG_DIR/bin/clang" ]; then
