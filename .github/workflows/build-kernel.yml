        if: always() && steps.filter.outputs.skip != 'true'
        run: |
          OUT="out-dizi66.${{ matrix.android }}"
          echo "### DIZI Division: ${{ matrix.android }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "$OUT/arch/arm64/boot/Image" ]; then
