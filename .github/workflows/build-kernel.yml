            echo "- **Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "- **Kernel Image**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Target**: Redmi Pad Pro WiFi / POCO Pad (dizi)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # Head Executive: Combines RUAN & DIZI deliverables into Universal Zip
  # =========================================================================
  head-package-and-release:
    name: "Head Executive: Package Universal Flashable Zip & Release"
    needs: [build-ruan, build-dizi]
    if: always() && !cancelled() && (needs.build-ruan.result == 'success' || needs.build-ruan.result == 'skipped') && (needs.build-dizi.result == 'success' || needs.build-dizi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all team build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: downloaded-artifacts

      - name: Stage team deliverables
        run: |
          set -euo pipefail
          echo "=== Staging deliverables from RUAN and DIZI teams ==="
          ls -la downloaded-artifacts/ || echo "No downloaded-artifacts found"

          find downloaded-artifacts -type d -name "out-*" | while read -r dir; do
            target=$(basename "$dir")
            echo "Staging $target from $dir..."
            cp -r "$dir" .
          done

          echo "Staged directories:"
          ls -d out-* 2>/dev/null || echo "No out-* directories staged"

      - name: Package universal flashable zip
        run: |
          set -euo pipefail
          chmod +x flashable/package.sh
          ./flashable/package.sh .

      - name: Verify universal zip integrity
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Universal flashable zip not found!"
            exit 1
          fi
          echo "Universal Zip successfully packaged: $ZIP"
          ls -lh "$ZIP"
          echo "=== Zip Structure ==="
          unzip -l "$ZIP"

      - name: Upload universal flashable zip as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: clyra-flip-kernel-universal-zip
          path: clyra-flip-kernel-universal-*.zip
          retention-days: 14

      - name: Prepare executive release notes
        run: |
          set -euo pipefail
          REL_FILE="/tmp/release-notes.md"
          cat << 'EOF' > "$REL_FILE"
          # Clyra-Flip Kernel v1.0.0 (Universal Release)

          Universal flashable AnyKernel3 kernel for **Xiaomi Redmi Pad Pro 5G (ruan)** and **Xiaomi Redmi Pad Pro WiFi / POCO Pad (dizi)** on Snapdragon 7s Gen 2 (SM7435).

          ### Key Specifications & Features
          - **Kernel Version**: Linux 6.6.162-Clyra-Flip (Long Term Support)
          - **Root Management**: Multi-Manager support for **KernelSU Next (KSUN v1.0.5-next)** and **KowSU (v1.0.5-kowsu)**
          - **Isolation**: **susfs v1.5.5** virtual filesystem with comprehensive root concealment
          - **SELinux**: Strict **Enforcing** mode (`selinux_enforcing_boot = 1`)
          - **OEM Compatibility**: Module signature enforcement relaxed (`# CONFIG_MODULE_SIG_FORCE is not set`) so stock Xiaomi `vendor_dlkm` modules load seamlessly
          - **Hardware / CAF**: Full Qualcomm / Code Aurora Forum platform support across audio, camera, display, power, interconnect, and SMEM subsystems
          - **Compiler**: AOSP Clang toolchain (`clang-r416183b`) for full Android KMI compatibility

          ### Included Kernel Deliverables
          Auto-detected at flash time by AnyKernel3:
          - `Image.ruan.android14`, `Image.ruan.android15`, `Image.ruan.android16`, `Image.ruan.android17`
          - `Image.dizi.android14`, `Image.dizi.android15`, `Image.dizi.android16`, `Image.dizi.android17`
          - Qualcomm SM7435 Device Tree Blobs (`dtb/*.dtb`)

          ### How to Flash
          1. Download `clyra-flip-kernel-universal-6.6.162-Clyra-Flip.zip`
          2. Boot device into TWRP or OrangeFox recovery
          3. Select Install -> Flash Zip -> Swipe to confirm
          4. Reboot System (Device and Android version are automatically recognized)
          EOF

          echo "Release notes generated:"
          cat "$REL_FILE"

      - name: Publish to GitHub Release v1.0.0
        if: (github.event.inputs.upload_release == 'true' || github.event_name == 'push') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=$(ls clyra-flip-kernel-universal-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No universal zip to upload"
            exit 1
          fi

          which gh || { echo "ERROR: gh CLI not found"; exit 1; }
          if gh release view v1.0.0 --json tagName -q '.tagName' 2>/dev/null | grep -q "v1.0.0"; then
            echo "Release v1.0.0 exists, updating release asset..."
            gh release upload v1.0.0 "$ZIP" --clobber
          else
            echo "Creating GitHub Release v1.0.0..."
            gh release create v1.0.0 "$ZIP" \
              --title "Clyra-Flip Kernel v1.0.0" \
              --notes-file /tmp/release-notes.md
          fi
          echo "Release asset upload complete!"

      - name: Executive summary
        if: always()
        run: |
          echo "## Clyra-Flip Enterprise Matrix Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Department | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **RUAN Division** | Redmi Pad Pro 5G (Android 14-17) | ${{ needs.build-ruan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **DIZI Division** | Redmi Pad Pro WiFi / POCO Pad (Android 14-17) | ${{ needs.build-dizi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Head Executive** | Universal Flashable Packager | Completed |" >> $GITHUB_STEP_SUMMARY
