      - name: Build dizi (${{ matrix.android }})
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh "$CLANG_DIR" dizi "${{ matrix.android }}" Image modules dtbs

      - name: Verify build outputs
